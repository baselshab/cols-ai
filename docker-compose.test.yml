version: '3.8'

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile.dev
  container_name: cols-backend-test
  environment:
    DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/cols_test?schema=public
    REDIS_URL: redis://redis-test:6379
    JWT_SECRET: test-secret-key-32-chars-minimum
    JWT_REFRESH_SECRET: test-refresh-secret-key-32
    NODE_ENV: test
  depends_on:
    - postgres-test
    - redis-test

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: cols-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cols_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    container_name: cols-redis-test
    ports:
      - "6380:6379"

  backend-test:
    <<: *backend-common
    command: npm run test:watch
    volumes:
      - ./backend:/app
      - /app/node_modules
